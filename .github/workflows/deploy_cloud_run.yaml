name: Deploy to Cloud Run

# Prod deploys are release-driven (see druthers-infra/docs/PROMOTION.md):
# publishing a vX.Y.Z release builds the image (with NEXT_PUBLIC_* baked in)
# into Artifact Registry and rolls the druthers-web service.
# No-ops until the GCP_* repo variables exist (set by the launch runbook).

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: vars.GCP_WIF_PROVIDER != ''
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/druthers/druthers-web:${{ github.event.release.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Build and push image
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
          docker build \
            --build-arg "NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}" \
            --build-arg "NEXT_PUBLIC_APP_ENV=prod" \
            --build-arg "NEXT_PUBLIC_SITE_URL=https://www.druthers.io" \
            -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy druthers-web \
            --image "$IMAGE" \
            --region ${{ vars.GCP_REGION }} \
            --project ${{ vars.GCP_PROJECT_ID }}

      # Tell the druthers super repo which tag is now deployed, so its pinned
      # submodule stops describing the previous release. Last step on purpose:
      # the pointer should only move once the roll above has succeeded.
      # DRUTHERS_SUPER_TOKEN is a fine-grained PAT with contents:write on
      # ALeonard9/druthers only; GITHUB_TOKEN cannot reach another repo.
      - name: Notify super repo of release
        if: success()
        continue-on-error: true   # a missed pointer is caught by staleness.yml
        env:
          GH_TOKEN: ${{ secrets.DRUTHERS_SUPER_TOKEN }}
        run: |
          gh api repos/ALeonard9/druthers/dispatches \
            -f event_type=release-published \
            -F "client_payload[repo]=druthers-web" \
            -F "client_payload[ref]=${{ github.event.release.tag_name }}"
